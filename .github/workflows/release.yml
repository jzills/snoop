name: Release

# Pushing a tag vX.Y.Z releases that commit. See RELEASING.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Everything this job does is disposable: it writes nothing outside the
  # runner, so a release stopped at the approval gate below leaves no trace.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Cross-compile every target
        run: scripts/build_binaries.sh "${{ steps.version.outputs.value }}"

      - name: Check the archives
        run: scripts/check_archives.sh "${{ steps.version.outputs.value }}"

      - name: Generate checksums
        run: cd dist && sha256sum snoop_*.tar.gz snoop_*.zip > SHA256SUMS

      # Rendered here so a formula that fails to render stops the release
      # before anything is published.
      - name: Render the Homebrew formula
        run: scripts/homebrew_formula.sh "${{ steps.version.outputs.value }}" > dist/snoop.rb

      # The npm packages and PyPI wheels carry the binaries built above.
      - name: Build the npm packages
        run: scripts/npm_packages.sh "${{ steps.version.outputs.value }}"

      - name: Build the PyPI wheels
        run: python3 scripts/wheels.py "${{ steps.version.outputs.value }}"

      # Installs each package the way users will and runs it, so a broken
      # package stops the release before anything is published.
      - name: Check the packages
        run: scripts/check_packages.sh "${{ steps.version.outputs.value }}"

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/snoop_*.tar.gz
            dist/snoop_*.zip
            dist/SHA256SUMS
            dist/snoop.rb
            dist/npm-packs/*.tgz
            dist/wheels/*.whl
          if-no-files-found: error

  # The approval gate. Give the `release` environment a required reviewer
  # (Settings → Environments) so nothing below starts until you approve the
  # run; without one, GitHub creates the environment unprotected.
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Outside the workspace, so nothing tracked can end up in the upload.
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # An optional paragraph opens the notes; GitHub's generated list of
      # changes follows it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=()
          if [ -s "release-notes/${GITHUB_REF_NAME}.md" ]; then
            notes=(--notes-file "$GITHUB_WORKSPACE/release-notes/${GITHUB_REF_NAME}.md")
          fi
          cd "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" \
            snoop_*.tar.gz snoop_*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${notes[@]}"

  # Commits the formula to jzills/homebrew-tap. Needs a HOMEBREW_TAP_TOKEN
  # secret: a fine-grained token with Contents read and write on that repo
  # only. Skipped, not failed, when the secret is absent.
  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: [build, github-release]
    timeout-minutes: 10
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap was not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: jzills/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download the formula
        if: steps.token.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Commit the formula
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p tap/Formula
          cp "$RUNNER_TEMP/release/snoop.rb" tap/Formula/snoop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/snoop.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "snoop ${{ needs.build.outputs.version }}"
          git push

  # Publishes the six platform packages, then snoop-cli, which depends on
  # them, on every release. The first release needs an NPM_TOKEN secret (a granular token that can publish);
  # once each package lists this workflow as a trusted publisher on
  # npmjs.com, delete the token and publishing uses OIDC. A version already
  # on npm is skipped, so a rerun picks up where a failed one stopped.
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build, github-release]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@11

      - name: Publish
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          cd "$RUNNER_TEMP/release/npm-packs"
          for tgz in jzills-snoop-cli-*.tgz snoop-cli-*.tgz; do
            name="$(tar -xOzf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published"
              continue
            fi
            npm publish "./$tgz" --provenance --access public
          done

  # Uploads the wheels with PyPI trusted publishing: add a (pending)
  # publisher on pypi.org for project snoop-cli, this repository and
  # release.yml. No token. Runs on every release.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, github-release]
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/release/wheels/
          skip-existing: true
