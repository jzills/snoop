# Hugo configuration for the snoop site.
#
# A landing page at / for now. Hextra is here, rather than a hand-written
# page, so documentation can go under content/docs/ later and pick up the
# theme's sidebar, table of contents and search without moving anything.
baseURL = "https://jzills.github.io/snoop/"
# The tab's text: the tagline, since the favicon already says "snoop".
title = "Watch Claude Code work."
[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the CLI's go.mod,
# where it would show up in Dependabot runs and govulncheck.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  # The README's demo, published as is rather than copied into static/,
  # where a second copy would go stale the next time demo/render.sh runs.
  [[module.mounts]]
    source = "../demo"
    target = "static/demo"
    files = ["demo.gif"]

[markup]
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

[params]
  description = "A terminal viewer for Claude Code sessions: follow one live, and see what each prompt cost, how full the context is, which files changed and what the subagents did."

  # layouts/_partials/navbar-title.html draws the wordmark itself.
  [params.navbar]
    displayTitle = false
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  # Off until there are docs to search.
  [params.search]
    enable = false

  [params.theme]
    default = "dark"
    displayToggle = true

[menu]
  [[menu.main]]
    name = "Install"
    pageRef = "/#install"
    weight = 1
  [[menu.main]]
    name = "Features"
    pageRef = "/#features"
    weight = 2
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/snoop"
    weight = 3
    [menu.main.params]
      icon = "github"
