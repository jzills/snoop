# Hugo configuration for the snoop site.
#
# A landing page at / (layouts/home.html) and the documentation under
# content/docs/, which takes Hextra's sidebar, table of contents and search.
baseURL = "https://jzills.github.io/snoop/"
title = "snoop"
[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the CLI's go.mod,
# where it would show up in Dependabot runs and govulncheck.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

[markup]
  [markup.goldmark.renderer]
    # Shortcodes inside Hextra's {{% steps %}} are rendered as markdown, so
    # the figures the shot shortcode writes are raw HTML to Goldmark, which
    # drops them unless told otherwise.
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "A terminal viewer for Claude Code sessions: follow one live, and see what each prompt cost, how full the context is, which files changed and what the subagents did."

  # layouts/_partials/navbar-title.html draws the logo and name itself.
  [params.navbar]
    displayTitle = false
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"

  [params.editURL]
    enable = true
    base = "https://github.com/jzills/snoop/edit/main/site/content"

  [params.page]
    width = "wide"

  [params.theme]
    default = "system"
    displayToggle = true

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/snoop"
    weight = 3
    [menu.main.params]
      icon = "github"
