# Hugo configuration for the snoop site.
#
# A landing page at / (layouts/home.html) and the documentation under
# content/docs/, which takes Hextra's sidebar, table of contents and search.
baseURL = "https://jzills.github.io/snoop/"
title = "snoop"
# No tag or category pages: no page has either, so Hugo's default /tags/ and
# /categories/ were empty, and listed in the sitemap they were indexed as thin
# pages.
disableKinds = ["taxonomy", "term"]
[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the CLI's go.mod,
# where it would show up in Dependabot runs and govulncheck.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Read, not published: the release notes page renders each paragraph from
  # release-notes/. They reach main only in a release's own pull request, so
  # the site, built from main, never shows a version nobody can install.
  # Mounted rather than copied into site/, since a copy goes stale with every
  # release.
  [[module.mounts]]
    source = "../release-notes"
    target = "assets/release-notes"

[markup]
  [markup.goldmark.renderer]
    # Shortcodes inside Hextra's {{% steps %}} are rendered as markdown, so
    # the figures the shot shortcode writes are raw HTML to Goldmark, which
    # drops them unless told otherwise.
    unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  description = "Follow a Claude Code session live, and see what each prompt cost, how full the context is, which files changed and what the subagents did."

  # layouts/_partials/navbar-title.html draws the logo and name itself.
  [params.navbar]
    displayTitle = false
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"

  [params.editURL]
    enable = true
    base = "https://github.com/jzills/snoop/edit/main/site/content"

  [params.page]
    width = "wide"

  [params.theme]
    default = "system"
    displayToggle = true

# The bar holds a first visitor's top tasks, the same on each of the project
# sites: Documentation, Quickstart, Releases, Search, GitHub and the
# light/dark button. Documentation keeps the docs section's own title, so the
# bar and the breadcrumb under it name the section the same way. The footer
# covers the rest. Quickstart is the first step, and opens with the install;
# Releases shows that snoop ships often.
[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Quickstart"
    pageRef = "/docs/quickstart"
    weight = 2
  [[menu.main]]
    name = "Releases"
    pageRef = "/releases"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/snoop"
    weight = 5
    [menu.main.params]
      icon = "github"
  # Hextra's light, dark and system switch, in the bar on every page. The
  # landing page has no sidebar, and the footer's copy is gone (see
  # layouts/_partials/footer.html), so this is where it lives.
  [[menu.main]]
    name = "Theme"
    weight = 6
    [menu.main.params]
      type = "theme-toggle"
