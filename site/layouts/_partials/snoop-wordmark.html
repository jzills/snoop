{{- /*
  The wordmark: "snoop" with its "oo" drawn as two eyes glancing sideways,
  sized in em to sit on the letters' x-height. The eyes take the accent
  color; screen readers hear "snoop".
*/ -}}
<span class="snoop-wordmark" role="img" aria-label="snoop">
  {{- "" -}}<span aria-hidden="true">sn</span>
  {{- with resources.Get "snoop-oo.svg" }}{{ .Content | safeHTML }}{{ end -}}
  <span aria-hidden="true">p</span>
</span>
{{- "" -}}
