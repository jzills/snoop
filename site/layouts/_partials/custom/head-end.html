{{- /*
  The install command's copy button, on the landing page only. Deferred: the
  button ships hidden and the page reads correctly without it.
*/ -}}
{{- if .IsHome }}
  {{- with resources.Get "js/snoop-install.js" }}
    {{- $install := . | minify | fingerprint }}
    <script defer src="{{ $install.RelPermalink }}" integrity="{{ $install.Data.Integrity }}"></script>
  {{- end }}
{{- end }}
