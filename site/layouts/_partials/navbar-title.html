{{- /*
  Overrides Hextra's navbar title with the wordmark. hx:ltr:mr-auto is what
  pushes the menu to the right. On the home page the link is "#", so a click
  scrolls to the top instead of reloading.
*/ -}}
<a
  class="snoop-navbar-mark hx:flex hx:items-center hx:hover:opacity-75 hx:ltr:mr-auto hx:rtl:ml-auto"
  href="{{ if .IsHome }}#{{ else }}{{ .Site.Home.RelPermalink }}{{ end }}"
>
  {{- partial "snoop-wordmark.html" . -}}
</a>
