{{- /*
  Overrides Hextra's navbar title: the mark, inlined so it takes the accent
  color in both themes, beside the name. hx:ltr:mr-auto pushes the menu to
  the right.
*/ -}}
<a
  class="snoop-brand hx:hover:opacity-75 hx:ltr:mr-auto hx:rtl:ml-auto"
  href="{{ .Site.Home.RelPermalink }}"
>
  {{- with resources.Get "snoop-mark.svg" }}{{ .Content | safeHTML }}{{ end -}}
  <span class="snoop-brand__name">snoop</span>
</a>
