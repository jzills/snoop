{{- /*
  The install command in the shared footer (custom/footer.html), with the copy
  button assets/js/snoop-install.js reveals and wires up, as on the landing
  page.
*/ -}}
<div class="snoop-command" data-snoop-copy>
  <code class="snoop-install__command">curl -fsSL https://j.zills.io/snoop/install.sh | sh</code>
  <button type="button" class="snoop-install__copy" aria-label="Copy the install command" hidden><svg viewBox="0 0 16 16" aria-hidden="true" class="snoop-install__icon snoop-install__icon--copy"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg><svg viewBox="0 0 16 16" aria-hidden="true" class="snoop-install__icon snoop-install__icon--done"><path d="M3 8.5 6.5 12 13 4.5"/></svg></button>
  <span class="snoop-install__status" role="status"></span>
</div>
